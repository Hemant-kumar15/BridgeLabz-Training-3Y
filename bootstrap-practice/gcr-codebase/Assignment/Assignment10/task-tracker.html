<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker.css">
</head>
<body>
    <main class="container py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Task Tracker</h1>
                <p class="text-muted mb-0">Keep your daily work organised.</p>
            </div>
            <span class="badge text-bg-primary fs-6">4 Pending</span>
        </header>

        <section class="list-group shadow-sm">
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Finish homepage design
                <span class="badge text-bg-danger">High</span>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Review CSS notes
                <span class="badge text-bg-warning">Medium</span>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Update project README
                <span class="badge text-bg-success">Low</span>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Push assignment files
                <span class="badge text-bg-danger">High</span>
            </div>
        </section>

        <button class="btn btn-success mt-4">
            Completed <span class="badge text-bg-light text-dark">6</span>
        </button>
    </main>

    <footer class="text-center py-3 border-top">
        <p class="mb-0">Task Tracker | Hemant Kumar</p>
    </footer>
</body>
</html>
