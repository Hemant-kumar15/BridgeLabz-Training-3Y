<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore India</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="travel-agency-showcase.css">
</head>
<body>
    <header class="bg-dark text-white">
        <nav class="navbar navbar-dark container">
            <a class="navbar-brand fw-bold" href="#">Explore India</a>
        </nav>
    </header>

    <main>
        <section class="container py-4">
            <div id="destinationCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner rounded shadow">
                    <div class="carousel-item active" data-bs-interval="3000">
                        <img src="https://picsum.photos/1200/550?random=61" class="d-block w-100" alt="Mountains">
                        <div class="carousel-caption">
                            <h2>Himalayan Escape</h2>
                            <p>Peaceful mountain views and fresh air.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="4000">
                        <img src="https://picsum.photos/1200/550?random=62" class="d-block w-100" alt="Beach">
                        <div class="carousel-caption">
                            <h2>Goa Getaway</h2>
                            <p>Relax by the sea and enjoy a colourful weekend.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="3500">
                        <img src="https://picsum.photos/1200/550?random=63" class="d-block w-100" alt="City">
                        <div class="carousel-caption">
                            <h2>Jaipur Journey</h2>
                            <p>Discover forts, markets and local culture.</p>
                        </div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#destinationCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#destinationCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>

            <section class="mt-5">
                <div class="d-flex justify-content-between mb-2">
                    <h2 class="h5">Booking Completion</h2>
                    <span>70%</span>
                </div>
                <div class="progress" role="progressbar" aria-label="Booking completion" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%">70%</div>
                </div>
            </section>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-1">Contact: travel@example.com | +91 98765 43210</p>
        <p class="mb-0">Explore India | Hemant Kumar</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
