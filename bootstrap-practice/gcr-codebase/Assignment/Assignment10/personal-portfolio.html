<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemant Kumar - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">
    <header class="text-center bg-white py-4">
        <div class="container">
            <h1 class="fw-bold">Hemant Kumar</h1>
            <p class="lead mb-0">Computer Science Student & Cybersecurity Enthusiast</p>
        </div>
    </header>

    <main>
        <section class="container text-center py-5">
            <img src="https://i.pravatar.cc/300?img=12" class="img-fluid rounded-circle profile-img mb-4" alt="Hemant Kumar">
            <h2 class="fw-bold">Hello, I am Hemant</h2>
            <p class="mb-3">I enjoy building websites, learning cybersecurity and solving programming problems.</p>
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>

            <form class="contact-form mx-auto mt-5 text-start">
                <h3 class="text-center mb-3">Contact Me</h3>
                <input type="text" class="form-control mb-3" placeholder="Your Name">
                <input type="email" class="form-control mb-3" placeholder="Your Email">
                <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
                <button class="btn btn-dark w-100">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="text-center py-3 bg-dark text-white">
        <p class="mb-0">Portfolio | Hemant Kumar</p>
    </footer>
</body>
</html>
