<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-4">
        <h1>Tech Store</h1>
        <p class="mb-0">Useful products for everyday work</p>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <!-- col-md-3 gives four columns on medium and larger screens -->
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/400/300?random=21" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h2 class="h5">Laptop Stand</h2>
                        <p>₹1,299</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/400/300?random=22" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h2 class="h5">Headphones</h2>
                        <p>₹2,499</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/400/300?random=23" class="card-img-top" alt="Keyboard">
                    <div class="card-body">
                        <h2 class="h5">Keyboard</h2>
                        <p>₹1,799</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/400/300?random=24" class="card-img-top" alt="Mouse">
                    <div class="card-body">
                        <h2 class="h5">Wireless Mouse</h2>
                        <p>₹899</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <footer class="text-center bg-dark text-white py-3">
        <p class="mb-0">Tech Store | Prepared by Hemant Kumar</p>
    </footer>
</body>
</html>
