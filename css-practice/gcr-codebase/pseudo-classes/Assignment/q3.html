<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
<header><h1>Image Showcase</h1></header>
<main class="gallery">
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=1" alt="Nature"><div class="overlay"></div></div><figcaption>Nature</figcaption></figure>
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=2" alt="Mountain"><div class="overlay"></div></div><figcaption>Mountain</figcaption></figure>
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=3" alt="City"><div class="overlay"></div></div><figcaption>City</figcaption></figure>
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=4" alt="Forest"><div class="overlay"></div></div><figcaption>Forest</figcaption></figure>
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=5" alt="Beach"><div class="overlay"></div></div><figcaption>Beach</figcaption></figure>
    <figure><div class="image"><img src="https://picsum.photos/500/350?random=6" alt="Sunset"><div class="overlay"></div></div><figcaption>Sunset</figcaption></figure>
</main>
</body>
</html>
