<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>
<header>
    <h1>Combined CSS Effects</h1>
    <p>Hover over the boxes and buttons</p>
</header>
<main class="effects">
    <section class="effect-box">
        <h2>Button 1</h2>
        <button>Click Me</button>
        <p>This button changes size and color on hover.</p>
    </section>
    <section class="effect-box">
        <h2>Button 2</h2>
        <button>Explore</button>
        <p>This button uses transition and shadow.</p>
    </section>
    <section class="effect-box">
        <h2>Button 3</h2>
        <button>Read More</button>
        <p>This button moves slightly on hover.</p>
    </section>
</main>
<footer>
    <p>Created by Hemant Kumar</p>
</footer>
</body>
</html>
