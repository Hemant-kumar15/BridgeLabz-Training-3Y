<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
<main>
    <h1>CSS Tooltip Demo</h1>
    <p>Move the mouse over the items.</p>
    <section class="items">
        <div class="item">Home<span class="tooltip">Go to Home</span></div>
        <div class="item">Profile<span class="tooltip">Open Profile</span></div>
        <div class="item">Settings<span class="tooltip">Open Settings</span></div>
        <div class="item">Help<span class="tooltip">Get Help</span></div>
    </section>
</main>
</body>
</html>
