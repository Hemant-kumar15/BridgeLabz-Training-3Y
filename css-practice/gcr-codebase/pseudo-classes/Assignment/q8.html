<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
<main>
    <h1>Box Sizing Comparison</h1>
    <section class="boxes">
        <div class="box content-box">
            <h2>Content Box</h2>
            <p>Width does not include padding and border. Therefore the total size becomes larger.</p>
        </div>
        <div class="box border-box">
            <h2>Border Box</h2>
            <p>Width includes padding and border. Therefore the total size stays within the given width.</p>
        </div>
    </section>
</main>
</body>
</html>
