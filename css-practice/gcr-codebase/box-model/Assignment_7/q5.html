<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
<header>
    <h1>Advanced CSS Selectors</h1>
</header>

<main>
    <section>
        <h2>Input Fields</h2>
        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter email">
    </section>

    <section>
        <h2>Links</h2>
        <a href="https://example.com">Secure Link</a>
        <a href="https://google.com">Another Link</a>
    </section>

    <section class="list-area">
        <h2>Item List</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Java</li>
            <li>Python</li>
        </ul>
        <p>First paragraph</p>
        <p>Second paragraph</p>
        <p>Third paragraph</p>
    </section>
</main>
</body>
</html>
