<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
<main>
    <h1>Height and Width Practice</h1>

    <section class="layout">
        <div class="box first">
            <h2>Pixel Box</h2>
            <p>This box uses fixed pixel width and height.</p>
        </div>

        <div class="box second">
            <h2>Percentage Box</h2>
            <p>This box uses percentage width and has a maximum width.</p>
        </div>

        <div class="box third">
            <h2>Viewport Box</h2>
            <p>This box uses vh and em units. Extra text is hidden using overflow.</p>
        </div>
    </section>
</main>
</body>
</html>
