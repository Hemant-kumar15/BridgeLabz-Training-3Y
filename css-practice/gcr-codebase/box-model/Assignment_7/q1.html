<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
<header>
    <h1>Borders and Padding</h1>
    <p>Different border styles and padding examples</p>
</header>

<main class="container">
    <section class="boxes">
        <div class="box solid">
            <h2>Solid Border</h2>
            <p>Normal solid border with medium padding.</p>
        </div>

        <div class="box dashed">
            <h2>Dashed Border</h2>
            <p>Dashed border with more padding.</p>
        </div>

        <div class="box double">
            <h2>Double Border</h2>
            <p>Double border with large padding.</p>
        </div>

        <div class="box groove">
            <h2>Groove Border</h2>
            <p>Groove border with rounded corners.</p>
        </div>
    </section>
</main>

<footer>
    <p>Created by Hemant Kumar</p>
</footer>
</body>
</html>
