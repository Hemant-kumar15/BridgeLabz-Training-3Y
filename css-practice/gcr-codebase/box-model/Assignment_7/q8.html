<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
<main>
    <h1>CSS Box Model</h1>

    <section class="demo">
        <div class="margin-layer">
            <div class="border-layer">
                <div class="padding-layer">
                    <div class="content-layer">
                        Content
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="info">
        <p><strong>Margin:</strong> Space outside the border.</p>
        <p><strong>Border:</strong> Line around the padding.</p>
        <p><strong>Padding:</strong> Space between content and border.</p>
        <p><strong>Content:</strong> The actual text or element.</p>
    </section>

    <section class="sizes">
        <div class="default-box">Default box-sizing</div>
        <div class="border-box">border-box sizing</div>
    </section>
</main>
</body>
</html>
