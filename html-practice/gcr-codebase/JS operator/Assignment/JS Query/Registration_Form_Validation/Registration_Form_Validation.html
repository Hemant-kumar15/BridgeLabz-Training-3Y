<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form Validation</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="Registration_Form_Validation.js" defer></script>
</head>
<body><main>
<h1>Registration Form</h1><form id="registerForm">
<label>Name</label><input type="text" id="name" placeholder="Enter your name">
<label>Email</label><input type="email" id="email" placeholder="Enter your email">
<label>Password</label><input type="password" id="password" placeholder="At least 8 characters">
<button type="submit">Register</button></form><p id="message"></p>
</main></body>
</html>
