<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>

<h1>Course Registration Form</h1>

<form>
    <fieldset>
        <legend>Student Details</legend>

        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Course:</label>
        <select>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>
        <br><br>

        <input type="submit" value="Register">
    </fieldset>
</form>

<h2>Course Schedule</h2>

<table border="1">
    <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Instructor</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>10 AM</td>
        <td>Mr. Sharma</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td>11 AM</td>
        <td>Ms. Singh</td>
    </tr>
</table>

</body>
</html>
